<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة خطة 10٪ V43</title><style>body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f4f8fb;color:#173552}#s{padding:18px 22px;background:#fff;border:1px solid #dbe6ee;border-radius:14px;box-shadow:0 10px 30px rgba(23,53,82,.08)}</style></head><body><div id="s">جارٍ تحميل المعاينة V43…</div><script>(async()=>{try{if(!('DecompressionStream' in window))throw new Error('المتصفح لا يدعم فك الضغط');const fs=['chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt','chunk5a.txt','chunk5b.txt','chunk6.txt','chunk7.txt'];const parts=await Promise.all(fs.map(f=>fetch('../preview/'+f+'?v=43',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const u=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const old=new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());const pb=await fetch('patch.txt?v=43',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('patch '+r.status);return r.text()});const pu=Uint8Array.from(atob(pb.trim()),c=>c.charCodeAt(0));const ops=JSON.parse(new TextDecoder().decode(await new Response(new Blob([pu]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()));let ls=old.split('\n');for(let i=ops.length-1;i>=0;i--){const [a,b,r]=ops[i];ls.splice(a,b-a,...r)}document.open();document.write(ls.join('\n'));document.close()}catch(e){console.error(e);document.getElementById('s').textContent='تعذر تحميل V43: '+(e&&e.message?e.message:e)}})();</script></body></html>
