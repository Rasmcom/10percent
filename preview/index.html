<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10% Activity Preview</title><style>body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f4f8fb;color:#173552}#s{padding:18px 22px;background:white;border:1px solid #dbe6ee;border-radius:14px}</style></head><body><div id="s">جارٍ تحميل المعاينة…</div><script>(async()=>{try{const n=7;const a=await Promise.all(Array.from({length:n},(_,i)=>fetch(`chunk${i+1}.txt`).then(r=>{if(!r.ok)throw Error('chunk');return r.text()})));const b=a.join('');const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const ab=await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer();const h=new TextDecoder().decode(ab);document.open();document.write(h);document.close()}catch(e){document.getElementById('s').textContent='تعذر تحميل المعاينة'}})();</script></body></html>
